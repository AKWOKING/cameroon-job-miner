name: Weekly Job Miner

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday 03:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  scrape-and-analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write       # needed to commit DB back to repo

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Run scrapers (Phase 1) ─────────────────────────────────────────────
      #    jobs.db in repo (if committed) is checked out and reused automatically
      - name: Run scrapers
        run: python run_scrapers.py
        env:
          PYTHONUNBUFFERED: "1"

      # ── 5. Run cleaning + mining pipeline (Phases 2 & 3) ─────────────────────
      - name: Run cleaning & mining pipeline
        run: python run_pipeline.py
        env:
          PYTHONUNBUFFERED: "1"

      # ── 6. Commit updated DB and exports back to repo ─────────────────────────
      #    This means every subsequent run starts with the accumulated data
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db data/exports/ || true
          git diff --staged --quiet || git commit -m "chore: weekly data update [skip ci]"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. Upload exports as downloadable artifacts ───────────────────────────
      - name: Upload data exports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-data-exports-${{ github.run_number }}
          path: |
            data/exports/
            scraper.log
            pipeline.log
          retention-days: 30
