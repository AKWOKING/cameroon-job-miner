name: Weekly Job Miner

on:
  schedule:
    # Every Monday at 03:00 UTC (low-traffic, polite)
    - cron: "0 3 * * 1"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  scrape-and-analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Restore persisted database from previous run ───────────────────────
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      # ── 5. Run scrapers (Phase 1) ─────────────────────────────────────────────
      - name: Run scrapers
        run: python run_scrapers.py
        env:
          PYTHONUNBUFFERED: "1"

      # ── 6. Run cleaning + mining pipeline (Phases 2 & 3) ─────────────────────
      - name: Run cleaning & mining pipeline
        run: python run_pipeline.py
        env:
          PYTHONUNBUFFERED: "1"

      # ── 7. Upload exports as artifacts ────────────────────────────────────────
      - name: Upload data exports
        uses: actions/upload-artifact@v4
        with:
          name: job-data-exports-${{ github.run_number }}
          path: |
            data/exports/
            scraper.log
            pipeline.log
          retention-days: 30

      # ── 8. Persist updated database ───────────────────────────────────────────
      - name: Save updated database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}

      # ── 9. Commit updated DB to repo (optional — uncomment to enable) ─────────
      # - name: Commit updated database
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add data/jobs.db data/exports/
      #     git diff --staged --quiet || git commit -m "chore: weekly data update [skip ci]"
      #     git push
