services:
  - type: web
    name: cameroon-job-miner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: job-data
      mountPath: /data
      sizeGB: 1
